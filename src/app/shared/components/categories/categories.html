<section class="categories-container">
  <section class="category-header bg-white mb-4 flex flex-col lg:flex-row lg:bg-transparent lg:justify-between lg:items-center mr-4">
    <!--Right Section-->
    <section class="right-section flex items-center">
      <!--Filtered Category-->
      <section class="filtered-category hidden lg:block">
        <button class="flex items-center gap-3" (click)="onOpenCloseCategoryItems()">
          <span [innerHTML]="sanitizer.bypassSecurityTrustHtml(filteredItem.icon)"></span>
          <span>
        <span>دسته بندی : </span>
        <span>{{ filteredItem.value }}</span>
      </span>
        </button>
      </section>
      <span class="divider ml-4 mr-6 hidden lg:block"></span>
      <!--Secondary Menu-->
      <section class="secondary-menu-container">
        <app-secondary-menu [secondaryMenuItems]="secondaryMenuItems"></app-secondary-menu>
      </section>
      <span class="divider ml-4 mr-6 hidden lg:block"></span>
    </section>
    <!--Left Section-->
    <section class="left-section hidden lg:flex items-center">
      <!--Statement Filter-->
      <section class="statement-filter-container flex items-center gap-4">
        @for(statementFilterItem of statementFilterCategoryItems; track statementFilteredItem) {
          <button class="flex items-center gap-2">
            <span [innerHTML]="sanitizer.bypassSecurityTrustHtml(statementFilterItem.icon)"></span>
            <span>{{statementFilterItem.value}}</span>
          </button>
        }
      </section>
      <span class="divider ml-4 mr-6"></span>
      <section class="location-container">
        <button class="flex items-center gap-2">

          <span>دسته بندی ها</span>
        </button>
      </ng-template>
      <ng-template pTemplate="content">
        <ng-container *ngTemplateOutlet="categoryItems"></ng-container>
      </ng-template>
    </p-drawer>
  } @else {
    <ng-container *ngTemplateOutlet="categoryItems"></ng-container>
  }
</section>
<ng-template #categoryItems>
  <section
    class="category-items-container grid grid-cols-1 lg:grid-cols-4 gap-4 overflow-hidden transition-all duration-700"
    [ngClass]="showCategories ? 'lg:p-4':''"
    [class.max-h-0]="!showCategories"
    [class.max-h-[500px]]="showCategories"
    [class.opacity-0]="!showCategories"
    [class.opacity-100]="showCategories">
    @if(isMobile) {
      <span class="horizontal-divider"></span>
      @for (statementFilteredItem of statementFilterCategoryItems; track statementFilteredItem) {
        <div class="statement-filter-container flex items-center gap-2">
          <p-checkbox inputId="{{statementFilteredItem.value}}" name="statementFilteredItems" value="{{statementFilteredItem.value}}"/>
          <span class="statement-filter-item flex items-center gap-3">
            <span [innerHTML]="sanitizer.bypassSecurityTrustHtml(statementFilteredItem.icon)"></span>
            <label for="{{statementFilteredItem.value}}" class="ml-2"> {{statementFilteredItem.key}} </label>
          </span>
        </div>
      }
      <span class="horizontal-divider"></span>
    }
    @for(categoryItem of categoryListItems; track categoryItem) {
      <button
        class="category-item flex items-center gap-2"
        [class.active]="categoryItem === filteredItem"
        (click)="onSetNewCategory(categoryItem)">
        <span
          class="icon-container"
          [innerHTML]="sanitizer.bypassSecurityTrustHtml(categoryItem.icon)"></span>
        <span>{{categoryItem.value}}</span>
      </button>
    }
  </section>
</ng-template>
